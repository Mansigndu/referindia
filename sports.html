<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sports News | ReferIndia - Cricket, Football & More</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] },
          colors: { primary: '#1e3a8a', secondary: '#dc2626' }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans antialiased">

  <div id="navContainer"></div>

  <div class="bg-red-700 dark:bg-red-900 text-white py-2.5 overflow-hidden whitespace-nowrap border-b border-red-800">
    <div class="breaking-ticker inline-flex items-center space-x-6">
      <i class="fas fa-bolt text-yellow-300 ml-4"></i>
      <span id="breakingText">IPL 2026 Playoffs race heats up | India wins series | FIFA World Cup qualifiers</span>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="dynamic-content"></div>
  </main>

  <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-14 py-10">
    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8">
      <div><h3 class="font-bold text-xl">REFERINDIA</h3><p class="text-sm text-gray-600 dark:text-gray-400 mt-2">India's most trusted digital news source.</p></div>
      <div><h4 class="font-semibold text-lg">Explore</h4><ul class="text-sm space-y-2 mt-2"><li>Tech & Innovation</li><li>Cricket & Sports</li><li>India Politics</li></ul></div>
      <div><h4 class="font-semibold text-lg">Legal</h4><ul class="text-sm space-y-2 mt-2"><li>Privacy Policy</li><li>Terms of Use</li></ul></div>
      <div><h4 class="font-semibold text-lg">📧 Morning Brief</h4><div class="flex mt-2"><input id="footerEmail" type="email" placeholder="Your email" class="p-2 w-full text-sm border rounded-l dark:bg-gray-700"><button id="footerSubBtn" class="bg-blue-600 px-3 rounded-r text-white text-sm">Subscribe</button></div></div>
    </div>
    <div class="text-center text-xs text-gray-500 dark:text-gray-400 mt-10 border-t pt-6">© 2026 ReferIndia News</div>
  </footer>

  <script src="script.js"></script>
  <script>
    window.currentPage = 'category';
    window.currentCategory = 'sports';
    loadPageContent();
  </script>
</body>
</html>
